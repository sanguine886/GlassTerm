name: GlazeVerre
options:
  bundleIdPrefix: com.glazeverre
  deploymentTarget:
    iOS: "26.0"
  developmentLanguage: en
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1"
packages:
  GlassKit:
    path: Packages/GlassKit
  CoreSSH:
    path: Packages/CoreSSH
  TerminalKit:
    path: Packages/TerminalKit
  AIAgent:
    path: Packages/AIAgent
  Persistence:
    path: Packages/Persistence
targets:
  GlazeVerre:
    type: application
    platform: iOS
    sources:
      - App
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
    dependencies:
      - package: GlassKit
      - package: CoreSSH
      - package: TerminalKit
      - package: AIAgent
      - package: Persistence
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: GlazeVerre
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations:
          - en
          - zh-Hans
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiresFullScreen: true
        ITSAppUsesNonExemptEncryption: false
  GlazeVerreTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests/GlazeVerreTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: GlazeVerre
  GlazeVerreUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - Tests/GlazeVerreUITests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: GlazeVerre
schemes:
  GlazeVerre:
    build:
      targets:
        GlazeVerre: all
        GlazeVerreTests: [test]
        GlazeVerreUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - GlazeVerreTests
        - GlazeVerreUITests
