name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    name: Lint & Test (iOS 26 Simulator)
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install tooling
        run: |
          set -euo pipefail
          for tool in xcodegen swiftlint swiftformat; do
            if ! command -v "$tool" >/dev/null 2>&1; then
              brew install "$tool"
            fi
          done

      - name: Lint
        run: |
          set -euo pipefail
          swiftformat --lint .
          swiftlint --quiet

      - name: Generate Xcode project
        run: xcodegen generate

      - name: CoreSSH engine tests (swift test)
        run: |
          set -euo pipefail
          swift test --package-path Packages/CoreSSH --enable-code-coverage 2>&1

      - name: Coverage gate — CoreSSH ≥ 60% (ADR-0005)
        run: |
          set -euo pipefail
          report=$(find Packages/CoreSSH/.build -name "*.xccovreport" | head -1)
          if [ -z "${report}" ]; then
            echo "No xccovreport found for CoreSSH"; exit 1
          fi
          xcrun xccov view --report --json "${report}" > /tmp/core_ssh_cov.json
          python3 - <<'PY'
          import json, sys
          data = json.load(open('/tmp/core_ssh_cov.json'))
          targets = data['coverage']['targets']
          core = [t for t in targets if t['name'] == 'CoreSSH']
          if not core:
              print('CoreSSH target missing from coverage report:', [t['name'] for t in targets]); sys.exit(1)
          t = core[0]
          ratio = t['lineCoverage']
          print(f"CoreSSH line coverage: {ratio:.1%} ({t['coveredLines']}/{t['executableLines']})")
          sys.exit(0 if ratio >= 0.60 else 1)
          PY

      - name: Ensure iPhone 16 Pro simulator exists
        run: |
          set -euo pipefail
          if ! xcrun simctl list devices available | grep -q "iPhone 16 Pro ("; then
            runtime_id=$(xcrun simctl list runtimes | awk '/^iOS /{print $NF}' | tail -1)
            if [ -z "${runtime_id}" ]; then
              echo "No iOS simulator runtime found. Runtimes installed:"
              xcrun simctl list runtimes
              exit 1
            fi
            echo "Creating iPhone 16 Pro on runtime ${runtime_id}"
            xcrun simctl create "iPhone 16 Pro" \
              "com.apple.CoreSimulator.SimDeviceType.iPhone-16-Pro" \
              "${runtime_id}"
          fi

      - name: Build & Test
        run: |
          set -euo pipefail
          xcodebuild test \
            -project GlassTerm.xcodeproj \
            -scheme GlassTerm \
            -destination 'platform=iOS Simulator,name=iPhone 16 Pro' \
            -enableCodeCoverage YES \
            -derivedDataPath build/DerivedData \
            2>&1 | xcbeautify --quiet

      - name: Coverage gate — Persistence ≥ 60% (ADR-0005)
        run: |
          set -euo pipefail
          xcrun xccov view --report --json build/DerivedData/Logs/Test/*.xcresult > /tmp/app_cov.json || true
          python3 - <<'PY'
          import json, sys
          try:
              data = json.load(open('/tmp/app_cov.json'))
          except Exception as exc:
              print('Coverage report unreadable:', exc); sys.exit(1)
          targets = data['coverage']['targets']
          print('Targets:', [(t['name'], round(t['lineCoverage'], 2)) for t in targets])
          persistence = [t for t in targets if t['name'].startswith('Persistence')]
          if not persistence:
              print('Persistence target missing from coverage report'); sys.exit(1)
          t = persistence[0]
          ratio = t['lineCoverage']
          print(f"Persistence line coverage: {ratio:.1%} ({t['coveredLines']}/{t['executableLines']})")
          sys.exit(0 if ratio >= 0.60 else 1)
          PY

      - name: Coverage report
        if: always()
        run: |
          set -euo pipefail
          xcrun xccov view --report build/DerivedData/Logs/Test/*.xcresult || true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcresult
          path: build/DerivedData/Logs/Test
          retention-days: 7

  ipa:
    name: Unsigned IPA (device build)
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install xcodegen
        run: |
          set -euo pipefail
          command -v xcodegen >/dev/null 2>&1 || brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned device .app
        run: |
          set -euo pipefail
          xcodebuild build \
            -project GlassTerm.xcodeproj \
            -scheme GlassTerm \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/ipa \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            2>&1 | xcbeautify --quiet

      - name: Package unsigned ipa
        run: |
          set -euo pipefail
          mkdir -p build/Payload
          ditto "build/ipa/Build/Products/Release-iphoneos/GlassTerm.app" "build/Payload/GlassTerm.app"
          cd build
          zip -qry "GlassTerm-${GITHUB_SHA::7}-unsigned.ipa" Payload
          cd ..
          ls -lh build/*.ipa

      - name: Upload ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: GlassTerm-unsigned-ipa
          path: build/*.ipa
          retention-days: 14
