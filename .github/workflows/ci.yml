name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    name: Lint & Test (iOS 26 Simulator)
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install tooling
        run: |
          set -euo pipefail
          for tool in xcodegen swiftlint swiftformat; do
            if ! command -v "$tool" >/dev/null 2>&1; then
              brew install "$tool"
            fi
          done

      - name: Lint
        run: |
          set -euo pipefail
          swiftformat --lint .
          swiftlint --quiet

      - name: Generate Xcode project
        run: xcodegen generate

      - name: CoreSSH engine tests (swift test)
        run: |
          set -euo pipefail
          swift test --package-path Packages/CoreSSH --enable-code-coverage 2>&1

      - name: TerminalKit logic tests (swift test)
        run: |
          set -euo pipefail
          swift test --package-path Packages/TerminalKit 2>&1

      - name: AIAgent logic tests (swift test)
        run: |
          set -euo pipefail
          swift test --package-path Packages/AIAgent --enable-code-coverage 2>&1

      - name: Coverage gate — AIAgent ≥ 60% (ADR-0005, swift test)
        run: |
          set -euo pipefail
          profdata=$(find Packages/AIAgent/.build -name "*.profdata" | head -1)
          if [ -z "${profdata}" ]; then
            echo "No profdata found for AIAgent"; exit 1
          fi
          # The test binary lives inside AIAgentPackageTests.xctest/Contents/MacOS/;
          # exclude the sibling .dSYM DWARF file (not a coverage-able Mach-O).
          binary=$(find Packages/AIAgent/.build -type f -name "AIAgentPackageTests" -not -path "*dSYM*" | head -1)
          if [ -z "${binary}" ]; then
            echo "No AIAgentPackageTests binary found"; exit 1
          fi
          xcrun llvm-cov report -instr-profile "${profdata}" "${binary}" \
            -ignore-filename-regex "(Tests/|\.build/checkouts/)" \
            > /tmp/aia_cov.txt
          python3 - <<'PY'
          import re, sys
          text = open('/tmp/aia_cov.txt').read()
          total = [l for l in text.splitlines() if l.strip().startswith('TOTAL')][-1]
          cov = float(re.findall(r'([\d.]+)%', total)[-1])
          print(total.strip())
          print(f'AIAgent line coverage: {cov:.1f}%')
          sys.exit(0 if cov >= 60.0 else 1)
          PY

      - name: Persistence logic tests (swift test)
        run: |
          set -euo pipefail
          swift test --package-path Packages/Persistence --enable-code-coverage 2>&1

      - name: Coverage gate — Persistence ≥ 60% (ADR-0005, swift test)
        run: |
          set -euo pipefail
          profdata=$(find Packages/Persistence/.build -name "*.profdata" | head -1)
          if [ -z "${profdata}" ]; then
            echo "No profdata found for Persistence"; exit 1
          fi
          binary=$(find Packages/Persistence/.build -type f -name "PersistencePackageTests" -not -path "*dSYM*" | head -1)
          if [ -z "${binary}" ]; then
            echo "No PersistencePackageTests binary found"; exit 1
          fi
          xcrun llvm-cov report -instr-profile "${profdata}" "${binary}" \
            -ignore-filename-regex "(Tests/|\.build/checkouts/)" \
            > /tmp/persistence_cov.txt
          python3 - <<'PY'
          import re, sys
          text = open('/tmp/persistence_cov.txt').read()
          total = [l for l in text.splitlines() if l.strip().startswith('TOTAL')][-1]
          cov = float(re.findall(r'([\d.]+)%', total)[-1])
          print(total.strip())
          print(f'Persistence line coverage: {cov:.1f}%')
          sys.exit(0 if cov >= 60.0 else 1)
          PY

      - name: Coverage gate — CoreSSH ≥ 60% (ADR-0005)
        run: |
          set -euo pipefail
          # swift test emits LLVM profdata (not xccov), so llvm-cov reads it.
          profdata=$(find Packages/CoreSSH/.build -name "*.profdata" | head -1)
          if [ -z "${profdata}" ]; then
            echo "No profdata found for CoreSSH"; exit 1
          fi
          binary=$(find Packages/CoreSSH/.build -type f -name "CoreSSHPackageTests" -not -path "*dSYM*" | head -1)
          if [ -z "${binary}" ]; then
            echo "No CoreSSHPackageTests binary found"; exit 1
          fi
          xcrun llvm-cov report -instr-profile "${profdata}" "${binary}" \
            -ignore-filename-regex "(Tests/|\.build/checkouts/)" \
            > /tmp/core_ssh_cov.txt
          python3 - <<'PY'
          import re, sys
          text = open('/tmp/core_ssh_cov.txt').read()
          total = [l for l in text.splitlines() if l.strip().startswith('TOTAL')][-1]
          cov = float(re.findall(r'([\d.]+)%', total)[-1])
          print(total.strip())
          print(f'CoreSSH line coverage: {cov:.1f}%')
          sys.exit(0 if cov >= 60.0 else 1)
          PY

      - name: Ensure iPhone 16 Pro simulator exists
        run: |
          set -euo pipefail
          if ! xcrun simctl list devices available | grep -q "iPhone 16 Pro ("; then
            runtime_id=$(xcrun simctl list runtimes | awk '/^iOS /{print $NF}' | tail -1)
            if [ -z "${runtime_id}" ]; then
              echo "No iOS simulator runtime found. Runtimes installed:"
              xcrun simctl list runtimes
              exit 1
            fi
            echo "Creating iPhone 16 Pro on runtime ${runtime_id}"
            xcrun simctl create "iPhone 16 Pro" \
              "com.apple.CoreSimulator.SimDeviceType.iPhone-16-Pro" \
              "${runtime_id}"
          fi

      - name: Build & Test
        run: |
          set -euo pipefail
          mkdir -p build
          xcodebuild test \
            -project GlassTerm.xcodeproj \
            -scheme GlassTerm \
            -destination 'platform=iOS Simulator,name=iPhone 16 Pro' \
            -enableCodeCoverage YES \
            -derivedDataPath build/DerivedData \
            -skipPackagePluginValidation \
            2>&1 | tee build/test.log | xcbeautify \
            || (echo "=== raw xcodebuild tail ===" && tail -80 build/test.log && exit 1)

      - name: Coverage report
        if: always()
        run: |
          set -euo pipefail
          xcrun xccov view --report build/DerivedData/Logs/Test/*.xcresult || true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcresult
          path: build/DerivedData/Logs/Test
          retention-days: 7

  ipa:
    name: Unsigned IPA (device build)
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install xcodegen
        run: |
          set -euo pipefail
          command -v xcodegen >/dev/null 2>&1 || brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned device .app
        run: |
          set -euo pipefail
          mkdir -p build
          xcodebuild build \
            -project GlassTerm.xcodeproj \
            -scheme GlassTerm \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/ipa \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            2>&1 | tee build/build.log | xcbeautify --quiet || (echo "=== full build log tail ===" && tail -120 build/build.log && exit 1)

      - name: Package unsigned ipa
        run: |
          set -euo pipefail
          mkdir -p build/Payload
          ditto "build/ipa/Build/Products/Release-iphoneos/GlassTerm.app" "build/Payload/GlassTerm.app"
          cd build
          zip -qry "GlassTerm-${GITHUB_SHA::7}-unsigned.ipa" Payload
          cd ..
          ls -lh build/*.ipa

      - name: Upload ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: GlassTerm-unsigned-ipa
          path: build/*.ipa
          retention-days: 14
