excluded:
  - maidkit_ref
  - .build
  - build
  - DerivedData

line_length:
  warning: 120
  error: 160
type_body_length:
  warning: 300
  error: 400
file_length:
  warning: 300
  error: 500
force_cast: error
force_try: error

# Align with swiftformat's trailingCommas default: multiline lists carry trailing commas.
trailing_comma:
  mandatory_comma: true

# Design-token shorthand (xs/sm/md/lg/xl) is a deliberate two-letter vocabulary.
identifier_name:
  min_length: 2
